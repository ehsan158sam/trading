# D:\AdvancedTradingSystem\pytest.ini

[pytest]
# حالت اجرای تست های asyncio (auto معمولا بهترین گزینه است)
asyncio_mode = auto

# تنظیم اسکوپ پیش فرض برای event loop فیکسچرهای ناهمزمان
# این کار هشدار PytestDeprecationWarning مربوط به pytest-asyncio را برطرف می کند.
# 'function' یک انتخاب امن است، یعنی هر تابع تست event loop خودش را می گیرد.
asyncio_default_fixture_loop_scope = function

# ثبت مارکرهای سفارشی (اگر دارید) یا مارکرهای استفاده شده توسط پلاگین ها
markers =
    asyncio: mark a test as asyncio-driven (used by pytest-asyncio).
    # می توانید مارکرهای دیگری هم اینجا اضافه کنید

# فیلتر کردن هشدارها برای تمیزتر شدن خروجی تست
filterwarnings =
    # نادیده گرفتن هشدارهای مربوط به منسوخ شدن Validator های Pydantic V1 (اگر هنوز از آنها استفاده می کنید)
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    
    # نادیده گرفتن هشدارهای مربوط به منسوخ شدن Config class در Pydantic (معمولا از pydantic._internal._config)
    # استفاده از یک الگوی کلی تر برای پوشش دادن تغییرات احتمالی در شماره خط
    ignore::DeprecationWarning:pydantic\._internal\._config
    # اگر الگوی بالا کار نکرد، می توانید شماره خط را هم اضافه کنید (اما بدون کامنت در همان خط):
    # ignore::DeprecationWarning:pydantic._internal._config:323

    # نادیده گرفتن FutureWarning مربوط به fillna(method=...) از pandas
    # این هشدار در تست TradingEnv ظاهر شد
    ignore:Series.fillna with 'method' is deprecated:FutureWarning

    # می توانید هشدارهای دیگری را هم به همین ترتیب اضافه کنید
    # مثال: ignore:DEPRECATION Wording:module_that_emits_it